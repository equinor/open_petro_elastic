# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  UV_FROZEN: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        enable-cache: true
        prune-cache: false
        python-version: ${{ matrix.python-version }}
    - name: Lint with ruff
      run: |
        uv run ruff check
        uv run ruff format --check
    - name: Generate documentation
      run: |
        uv run sphinx-build docs docs_out/
        uv run sphinx-build -b doctest docs docs_out/
    - name: Test
      run: |
        uv run pytest
    - name: Run Examples
      run: |
        uv run open_petro_elastic --data-file examples/example1.csv examples/example1.yaml
        uv run open_petro_elastic --data-file examples/example2.csv examples/example2.yaml
        uv run open_petro_elastic examples/patchy_cement_example.yaml
        uv run open_petro_elastic examples/friable_sand_example.yaml
        uv run open_petro_elastic --generate-tutorial tutorial/
        uv run open_petro_elastic --data-file tutorial/tutorial_data.csv tutorial/tutorial_config.yaml
